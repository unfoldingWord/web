<!doctype html>
<!--
  Isolation frame for Virtuous CRM sign-up forms (Signup block).

  Virtuous's virtuous.embed.min.js injects a full, unlayered normalize.css
  (a { background: transparent }, h1 { font-size: 2em }, figure margins …)
  into the TOP page — it reaches out of a same-origin iframe to do it. So this
  page is served from a DIFFERENT origin, the media bucket (R2,
  unfoldingword-media → src/data/media.json), where it cannot touch the
  site's pages, and over HTTPS, which Virtuous forms require. The parent page
  passes the form in the query string and sizes the frame from the height
  posted back.

  <media base>/embeds/virtuous-signup.html?form=<data-vform>&org=<data-orgId>[&theme=dark]

  theme=dark: white bold labels and an Ocean button, for a form on a
  coloured band (the home page's Cultivate "Find out more" band).

  This file is not part of the site build. After changing it, upload it:
  npm run embeds:upload
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Sign up</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: 'Avenir', 'Avenir Next', 'Nunito Sans', ui-sans-serif, system-ui, sans-serif; color: #231f20; }
  form[id*='vcrm'] { max-width: 100% !important; }
  /* theme=dark: production's home sign-up on Cultivate */
  .theme-dark label { color: #fff !important; font: 700 16px/16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important; }
  .theme-dark input[type='text'], .theme-dark input[type='email'] { box-sizing: border-box; height: 41px; padding: 10px; border: 1px solid #007cad !important; border-radius: 3px !important; background: #fff; font-size: 16px; }
  .theme-dark button, .theme-dark input[type='submit'] { background: #014263 !important; color: #fff !important; border: 0 !important; border-radius: 3px !important; padding: 15px 30px !important; font: 700 16px/24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important; }
</style>
</head>
<body>
<div id="host"></div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var form = q.get('form') || '';
    var org = q.get('org') || '7243';
    if (q.get('theme') === 'dark') document.body.classList.add('theme-dark');
    if (!/^[0-9A-Fa-f-]{36}$/.test(form) || !/^\d+$/.test(org)) return;
    var s = document.createElement('script');
    s.src = 'https://cdn.virtuoussoftware.com/virtuous.embed.min.js';
    s.setAttribute('data-vform', form);
    s.setAttribute('data-orgId', org);
    s.setAttribute('data-isGiving', 'false');
    s.setAttribute('data-dependencies', '[]');
    document.getElementById('host').appendChild(s);
    function post() {
      parent.postMessage({ type: 'uw-embed-height', form: form, height: document.documentElement.scrollHeight }, '*'); // height only; nothing private
    }
    new ResizeObserver(post).observe(document.body);
    window.addEventListener('load', post);
  })();
</script>
</body>
</html>
